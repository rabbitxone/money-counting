    <script>
        function formatAmount(value) {
            let rounded = value.toFixed(2);
            let parts = rounded.split('.');
            let integerPart = parts[0];
            let decimalPart = parts[1];

            if (integerPart.length > 4) integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

            let display = integerPart;
            if (decimalPart !== '00') display += '.' + decimalPart;
            return display + ' USD';
        }

        function updateTotal() {
            let total = 0;
            let sum100 = (parseFloat($('#val100').val()) || 0) * 100;
            total += sum100;
            $('#sum100').text(formatAmount(sum100));

            // ---

            let sum50 = (parseFloat($('#val50').val()) || 0) * 50;
            total += sum50;
            $('#sum50').text(formatAmount(sum50));

            let sum20 = (parseFloat($('#val20').val()) || 0) * 20;
            total += sum20;
            $('#sum20').text(formatAmount(sum20));

            let sum10 = (parseFloat($('#val10').val()) || 0) * 10;
            total += sum10;
            $('#sum10').text(formatAmount(sum10));

            // ---

            let sum5 = (parseFloat($('#val5').val()) || 0) * 5;
            total += sum5;
            $('#sum5').text(formatAmount(sum5));

            let sum2 = (parseFloat($('#val2').val()) || 0) * 2;
            total += sum2;
            $('#sum2').text(formatAmount(sum2));

            let sum1 = (parseFloat($('#val1').val()) || 0) * 1;
            total += sum1;
            $('#sum1').text(formatAmount(sum1));

            // --- ---

            let sum050 = (parseFloat($('#val050').val()) || 0) * 0.5;
            total += sum050;
            $('#sum050').text(formatAmount(sum050));

            let sum025 = (parseFloat($('#val025').val()) || 0) * 0.25;
            total += sum025;
            $('#sum025').text(formatAmount(sum025));

            let sum010 = (parseFloat($('#val010').val()) || 0) * 0.1;
            total += sum010;
            $('#sum010').text(formatAmount(sum010));

            // ---

            let sum005 = (parseFloat($('#val005').val()) || 0) * 0.05;
            total += sum005;
            $('#sum005').text(formatAmount(sum005));

            let sum001 = (parseFloat($('#val001').val()) || 0) * 0.01;
            total += sum001;
            $('#sum001').text(formatAmount(sum001));

            $('#total').text(formatAmount(total));

            saveCurrentState();
        }

        function denomId(value) {
            if (value >= 1) return String(value);
            return parseFloat(value).toFixed(2).toString().replace('.', '');
        }

        function adjust(value, step) {
            let id = 'val' + denomId(value);
            let current = parseInt($('#' + id).val()) || 0;
            let next = Math.min(999999, Math.max(0, current + step));
            $('#' + id).val(next);
            rawExprMap[id] = String(next);
            updateTotal();
        }

        function plus(value) {
            adjust(value, 1);
        }

        function minus(value) {
            adjust(value, -1);
        }

        function plus10(value) {
            adjust(value, 10);
        }

        function minus10(value) {
            adjust(value, -10);
        }

        let activeId = null;
        let rawExprMap = {};

        const OPERATOR_SYMBOLS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
        const OPERATOR_REVERSE = { '−': '-', '×': '*', '÷': '/' };

        function toLogicalExpr(str) {
            return str.toString()
                .replace(/[−×÷]/g, function(ch) { return OPERATOR_REVERSE[ch]; })
                .replace(/\s+/g, '');
        }

        function formatExpr(expr) {
            return expr.replace(/[+\-*/]/g, function(op) {
                return ' ' + OPERATOR_SYMBOLS[op] + ' ';
            });
        }

        function getRawExpr(id) {
            if (!(id in rawExprMap)) rawExprMap[id] = toLogicalExpr($('#' + id).val());
            return rawExprMap[id];
        }

        function setRawExpr(id, expr) {
            rawExprMap[id] = expr;
            $('#' + id).val(formatExpr(expr));
        }

        function safeEval(expr) {
            expr = toLogicalExpr(expr).replace(/[+\-*/.]+$/, '');
            if (expr === '') return 0;
            if (!/^[0-9+\-*/]+$/.test(expr)) return NaN;
            try {
                return Function('"use strict"; return (' + expr + ')')();
            } catch (e) {
                return NaN;
            }
        }

        function finalizeInput(id) {
            if (!id) return;
            let raw = getRawExpr(id);
            let result = safeEval(raw);
            if (isNaN(result)) result = 0;
            result = Math.min(999999, Math.max(0, Math.round(result)));
            rawExprMap[id] = String(result);
            $('#' + id).val(result);
            updateTotal();
        }

        const MAX_EXPR_LEN = 9;

        function collapseExpr(expr) {
            let result = safeEval(expr);
            if (isNaN(result)) result = 0;
            result = Math.min(999999, Math.max(0, Math.round(result)));
            return String(result);
        }

        function keypadPress(key) {
            if (!activeId) return;
            let raw = getRawExpr(activeId);

            if (key === 'C') {
                setRawExpr(activeId, '0');
                updateTotal();
                return;
            }

            if (key === 'back') {
                raw = raw.length > 1 ? raw.slice(0, -1) : '0';
                setRawExpr(activeId, raw);
                updateTotal();
                return;
            }

            if (key === '=') {
                finalizeInput(activeId);
                return;
            }

            if (key === '+' || key === '-' || key === '*' || key === '/') {
                if (/[+\-*/]$/.test(raw)) {
                    raw = raw.slice(0, -1) + key;
                } else {
                    if (raw.length >= MAX_EXPR_LEN - 1) raw = collapseExpr(raw);
                    raw = raw + key;
                }
                setRawExpr(activeId, raw);
                updateTotal();
                return;
            }

            // digit
            raw = (raw === '0') ? key : raw + key;
            if (raw.length > MAX_EXPR_LEN) return;
            setRawExpr(activeId, raw);
            updateTotal();
        }

        function updateContentPadding() {
            let barHeight = $('#bottom-bar').outerHeight() || 0;
            $('#page-content').css('padding-bottom', (barHeight + 16) + 'px');
        }

        function openKeypad() {
            $('#keypad-panel').removeClass('hidden');
            updateContentPadding();
        }

        function closeKeypad() {
            $('#keypad-panel').addClass('hidden');
            updateContentPadding();
            if (document.activeElement && document.activeElement.classList.contains('val-input')) {
                document.activeElement.blur();
            }
        }

        $(window).on('resize', updateContentPadding);

        function scrollFieldAboveKeypad(inputEl) {
            let $row = $(inputEl).closest('.mb-3');
            let rowHeight = $row.outerHeight() || $(inputEl).outerHeight() || 0;
            let rowRect = $row[0].getBoundingClientRect();
            let barTop = $('#bottom-bar')[0].getBoundingClientRect().top;
            let delta = rowRect.bottom - (barTop - rowHeight);
            if (delta > 0) {
                window.scrollBy({ top: delta, behavior: 'smooth' });
            }
        }

        $('.val-input').on('focus', function() {
            $('.val-input').removeClass('ring-2 ring-blue-500');
            $(this).addClass('ring-2 ring-blue-500');
            activeId = $(this).attr('id');
            rawExprMap[activeId] = toLogicalExpr($(this).val());
            openKeypad();
            let el = this;
            setTimeout(function() {
                scrollFieldAboveKeypad(el);
            }, 50);
        });

        $('.val-input').on('focusout', function() {
            finalizeInput($(this).attr('id'));
        });

        $(document).on('click', function(e) {
            if ($(e.target).closest('#keypad-panel').length || $(e.target).closest('.val-input').length) return;
            if (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('val-input')) return;
            closeKeypad();
        });

        const STATE_KEY = 'moneyCounter_state_usd';
        const HISTORY_KEY = 'moneyCounter_history_usd';
        const HISTORY_LIMIT = 50;

        function getStateSnapshot() {
            let state = {};
            $('.val-input').each(function() {
                state[$(this).attr('id')] = $(this).val();
            });
            return state;
        }

        function applyStateSnapshot(state) {
            $('.val-input').each(function() {
                let id = $(this).attr('id');
                if (state && Object.prototype.hasOwnProperty.call(state, id)) {
                    $(this).val(state[id]);
                }
            });
        }

        function hasNonZeroValues() {
            let any = false;
            $('.val-input').each(function() {
                if ((parseInt($(this).val()) || 0) > 0) any = true;
            });
            return any;
        }

        function saveCurrentState() {
            localStorage.setItem(STATE_KEY, JSON.stringify(getStateSnapshot()));
        }

        function loadCurrentState() {
            let raw = localStorage.getItem(STATE_KEY);
            if (!raw) return;
            try {
                applyStateSnapshot(JSON.parse(raw));
            } catch (e) {}
        }

        function buildBreakdown() {
            let items = [];
            $('.val-input').each(function() {
                let count = parseInt($(this).val()) || 0;
                if (count <= 0) return;
                let label = $(this).closest('.mb-3').find('p.font-bold').first().text();
                items.push({ label: label, count: count });
            });
            return items;
        }

        function formatRelativeDate(dateStr) {
            let date = new Date(dateStr);
            let diffSec = Math.floor((Date.now() - date.getTime()) / 1000);

            if (diffSec < 60) return 'Just now';

            let diffMin = Math.floor(diffSec / 60);
            if (diffMin < 60) return diffMin + (diffMin === 1 ? ' minute ago' : ' minutes ago');

            let diffHour = Math.floor(diffMin / 60);
            if (diffHour < 24) return diffHour + (diffHour === 1 ? ' hour ago' : ' hours ago');

            let diffDay = Math.floor(diffHour / 24);
            if (diffDay <= 3) return diffDay + (diffDay === 1 ? ' day ago' : ' days ago');

            let datePart = date.toLocaleDateString('en-US');
            let timePart = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            return datePart + ', ' + timePart;
        }

        function loadHistory() {
            try {
                return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function saveToHistory() {
            let entry = {
                date: new Date().toISOString(),
                total: $('#total').text(),
                items: buildBreakdown(),
                state: getStateSnapshot()
            };
            let history = loadHistory();
            history.unshift(entry);
            if (history.length > HISTORY_LIMIT) history = history.slice(0, HISTORY_LIMIT);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        function renderHistoryList() {
            let history = loadHistory();
            let $list = $('#history-list');
            $list.empty();

            if (history.length === 0) {
                $list.append('<p class="text-slate-500 text-sm text-center py-6">No saved calculations.</p>');
                return;
            }

            history.forEach(function(entry, index) {
                let dateText = formatRelativeDate(entry.date);

                let $card = $('<div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-3"></div>');
                let $header = $('<div class="flex justify-between items-start gap-2"></div>');
                let $info = $('<div></div>');
                $info.append($('<p class="text-slate-500 text-xs font-medium"></p>').text(dateText));
                $info.append($('<p class="text-white font-bold"></p>').text(entry.total));
                let $actions = $('<div class="flex gap-1.5 shrink-0"></div>');
                let $restoreBtn = $('<button class="text-blue-300 text-xs font-semibold px-2.5 py-1 bg-blue-500/15 hover:brightness-125 active:scale-95 rounded-full transition">Restore</button>').on('click', function() { restoreHistoryEntry(index); });
                let $deleteBtn = $('<button class="text-red-300 text-xs font-semibold px-2.5 py-1 bg-red-500/15 hover:brightness-125 active:scale-95 rounded-full transition">Delete</button>').on('click', function() { deleteHistoryEntry(index); });
                $actions.append($restoreBtn).append($deleteBtn);
                $header.append($info).append($actions);
                $card.append($header);

                let $items = $('<div class="history-items text-slate-400 text-xs mt-1.5"></div>');
                if (entry.items.length === 0) {
                    $items.text('—');
                } else {
                    let maxLines = 2;
                    let visibleItems = entry.items.slice(0, maxLines);
                    let hasMore = entry.items.length > maxLines;
                    visibleItems.forEach(function(it, i) {
                        let text = it.label + ' × ' + it.count;
                        if (hasMore && i === visibleItems.length - 1) text += ' …';
                        $items.append($('<div></div>').text(text));
                    });
                }
                $card.append($items);
                $list.append($card);
            });
        }

        function restoreHistoryEntry(index) {
            let history = loadHistory();
            let entry = history[index];
            if (!entry) return;
            applyStateSnapshot(entry.state);
            updateTotal();
            closeHistory();
        }

        function deleteHistoryEntry(index) {
            let history = loadHistory();
            history.splice(index, 1);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            renderHistoryList();
        }

        function openHistory() {
            renderHistoryList();
            $('#history-modal').removeClass('hidden').addClass('flex');
        }

        function closeHistory() {
            $('#history-modal').addClass('hidden').removeClass('flex');
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear the whole history?')) {
                localStorage.removeItem(HISTORY_KEY);
                renderHistoryList();
            }
        }

        window.addEventListener('beforeunload', function(e) {
            if (hasNonZeroValues()) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        function resetAll() {
            if(confirm('Are you sure you want to reset all values? The current state will be saved to history.')) {
                if (hasNonZeroValues()) {
                    saveToHistory();
                }
                $('.val-input').val('0');
                updateTotal();
            }
        }

        function copyAll() {
            let toCopy = "";
            if(parseInt($('#val100').val()) > 0) toCopy = toCopy + '$100 (x' + $('#val100').val() + '): ' + $('#sum100').text() + '\n';
            
            if(parseInt($('#val50').val()) > 0) toCopy = toCopy + '$50 (x' + $('#val50').val() + '): ' + $('#sum50').text() + '\n';
            if(parseInt($('#val20').val()) > 0) toCopy = toCopy + '$20 (x' + $('#val20').val() + '): ' + $('#sum20').text() + '\n';
            if(parseInt($('#val10').val()) > 0) toCopy = toCopy + '$10 (x' + $('#val10').val() + '): ' + $('#sum10').text() + '\n';
            
            if(parseInt($('#val5').val()) > 0) toCopy = toCopy + '$5 (x' + $('#val5').val() + '): ' + $('#sum5').text() + '\n';
            if(parseInt($('#val2').val()) > 0) toCopy = toCopy + '$2 (x' + $('#val2').val() + '): ' + $('#sum2').text() + '\n';
            if(parseInt($('#val1').val()) > 0) toCopy = toCopy + '$1 (x' + $('#val1').val() + '): ' + $('#sum1').text() + '\n';
            
            // ---
            
            if(parseInt($('#val050').val()) > 0) toCopy = toCopy + '$0.50 (x' + $('#val050').val() + '): ' + $('#sum050').text() + '\n';
            if(parseInt($('#val025').val()) > 0) toCopy = toCopy + '$0.25 (x' + $('#val025').val() + '): ' + $('#sum025').text() + '\n';
            if(parseInt($('#val010').val()) > 0) toCopy = toCopy + '$0.10 (x' + $('#val010').val() + '): ' + $('#sum010').text() + '\n';
            
            if(parseInt($('#val005').val()) > 0) toCopy = toCopy + '$0.05 (x' + $('#val005').val() + '): ' + $('#sum005').text() + '\n';
            if(parseInt($('#val001').val()) > 0) toCopy = toCopy + '$0.01 (x' + $('#val001').val() + '): ' + $('#sum001').text() + '\n';

            if(toCopy !== '') {
                toCopy = toCopy + '\nTotal: ' + $('#total').text();
                navigator.clipboard.writeText(toCopy);
            }

            $('#btn-copy').html('<svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"/></svg>');

            setTimeout(() => {
                $('#btn-copy').html('<svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg>');
            }, 800)
        }

        loadCurrentState();
        updateTotal();
        updateContentPadding();

    </script>

</body>
</html>
